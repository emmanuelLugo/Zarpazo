name: Release

# Push a tag like v0.2.0 to publish a release: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = ([xml](Get-Content Zarpazo/Zarpazo.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $version) { throw "Tag v$tag does not match <Version> $version in Zarpazo.csproj." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        run: dotnet test Zarpazo.sln -c Release --blame-hang-timeout 6m --blame-hang-dump-type none --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # The log of a run can't be read without signing in, so what failed is also written as annotations, which anyone can see.
      - name: Name the tests that failed or hung
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Recurse -Filter 'Sequence_*.xml' -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($test in ([xml](Get-Content $_.FullName)).TestSequence.Test) {
              if ($test.Completed -ne 'True') { Write-Host "::error title=Test colgado::$($test.Name)" }
            }
          }
          Get-ChildItem TestResults -Recurse -Filter '*.trx' -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($r in ([xml](Get-Content $_.FullName)).TestRun.Results.UnitTestResult) {
              if ($r.outcome -eq 'Failed') {
                $message = ($r.Output.ErrorInfo.Message -replace '\s+', ' ')
                if ($message.Length -gt 400) { $message = $message.Substring(0, 400) }
                Write-Host "::error title=Test fallido::$($r.testName): $message"
              }
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and both executables
        shell: pwsh
        run: tools/build-installer.ps1

      - name: Name the files for the release
        shell: pwsh
        run: |
          # Zarpazo-Setup.exe never changes name, so /releases/latest/download/Zarpazo-Setup.exe always works.
          Copy-Item "publish/Zarpazo-Setup-$env:VERSION.exe" publish/Zarpazo-Setup.exe

      - name: Take the release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[' + [regex]::Escape($env:VERSION) + '\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)'
          $match = [regex]::Match($text, $pattern)
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { '' }
          if (-not $notes) { Write-Warning "CHANGELOG.md has no section for $env:VERSION."; $notes = "Zarpazo $env:VERSION" }
          Set-Content release-notes.md $notes -Encoding utf8

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' `
            publish/Zarpazo-Setup.exe `
            "publish/Zarpazo-Setup-$env:VERSION.exe" `
            publish/Zarpazo.exe `
            publish/Zarpazo-ligero.exe `
            --title "Zarpazo $env:VERSION" `
            --notes-file release-notes.md `
            --verify-tag
