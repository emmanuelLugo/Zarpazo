name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Zarpazo.sln -c Release

      # A test that never finishes (a media call waiting for a screen or a GPU the runner doesn't have) is stopped after 6 minutes
      # and named below, instead of holding the job until the 20-minute limit cancels it with no clue about which one it was.
      - name: Test
        run: dotnet test Zarpazo.sln -c Release --no-build --blame-hang-timeout 6m --blame-hang-dump-type none --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Name the test that hung
        if: failure() || cancelled()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Recurse -Filter 'Sequence_*.xml' -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($test in ([xml](Get-Content $_.FullName)).TestSequence.Test) {
              if ($test.Completed -ne 'True') { Write-Host "::error title=Test colgado::$($test.Name)" }
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
